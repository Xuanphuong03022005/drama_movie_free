<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Main Play/Flow Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="45%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Stream Flow Dynamic Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-opacity="0.5"/>

  <!-- Subtle Film Reel / Orbit Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" stroke-dasharray="12 12"/>

  <!-- Dynamic Flow Wave Behind Play Button -->
  <path d="M120 330 C 160 380, 260 410, 360 350 C 420 310, 440 240, 410 180 C 390 140, 340 120, 300 130" 
        fill="none" stroke="url(#ribbonGrad)" stroke-width="28" stroke-linecap="round" opacity="0.85" filter="url(#subtleGlow)"/>

  <!-- High-Energy Cinema Play Triangle Symbol with 3D Bevel Feel -->
  <g filter="url(#neonGlow)">
    <path d="M205 158 C 190 148, 172 158, 172 178 L 172 334 C 172 354, 190 364, 205 354 L 340 276 C 354 268, 354 244, 340 236 Z" 
          fill="url(#primaryGrad)"/>
  </g>

  <!-- Inner Play Glass Highlight -->
  <path d="M192 186 L 192 326 C 192 334, 198 338, 204 334 L 315 270 C 322 266, 322 256, 315 252 L 204 188 C 198 184, 192 180, 192 186 Z" 
        fill="#ffffff" opacity="0.22"/>

  <!-- Star Burst VIP Accent at Top Right -->
  <path d="M380 90 L 388 118 L 416 126 L 388 134 L 380 162 L 372 134 L 344 126 L 372 118 Z" 
        fill="#fbbf24" filter="url(#subtleGlow)"/>
</svg>
